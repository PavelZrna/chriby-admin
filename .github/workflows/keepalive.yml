name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "CHYBA: secret SUPABASE_ANON_KEY neni nastaveny nebo je prazdny"
            exit 1
          fi
          echo "Delka klice: ${#KEY} (ocekavano 208)"

          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "https://eqilmetmujdgzidvrjuh.supabase.co/rest/v1/categories?select=id&limit=1")

          echo "HTTP $code"
          echo "Odpoved: $(cat /tmp/out.json)"

          if [ "$code" = "200" ]; then
            echo "OK - projekt probuzen"
          else
            echo "SELHALO"
            exit 1
          fi
